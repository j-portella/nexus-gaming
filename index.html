<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Gaming · Gestão de Projetos</title>
  <meta name="description" content="Painel de gestão de projetos da Nexus Gaming.">
  <meta property="og:title" content="Nexus Gaming · Gestão de Projetos">
  <meta property="og:description" content="Painel de gestão de projetos da Nexus Gaming.">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #0A0F1E; overflow: hidden; }
    #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  </style>
</head>
<body>
  <iframe id="app" title="Nexus Gaming" allow="clipboard-write"></iframe>

  <script>
    // Link /exec da sua implantação atual no Apps Script (confira se está igual ao seu)
    var GAS_URL = "https://script.google.com/macros/s/AKfycbzfyuw8kMOri6P0mKUkz_1msozoTvHTq9pQPhD6NUTZbTuQR6Cgy5TZth6FZh8CgKj5/exec";

    var app = document.getElementById("app");

    // Abre a tela indicada no endereço (ex.: nexus.vercel.app/#status) ou o menu
    function carregar() {
      var tela = location.hash.replace("#", "");
      app.src = tela ? GAS_URL + "?tela=" + encodeURIComponent(tela) : GAS_URL;
    }

    // As telas do Apps Script pedem para trocar de página por mensagem
    window.addEventListener("message", function (e) {
      if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) return;
      if (!e.data || typeof e.data.nexusTela !== "string") return;
      var tela = e.data.nexusTela;
      if (tela === "menu" || tela === "") history.pushState(null, "", location.pathname);
      else history.pushState(null, "", "#" + tela);
      carregar();
    });

    // Botão voltar do navegador
    window.addEventListener("popstate", carregar);

    carregar();
  </script>
</body>
</html>
